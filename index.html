<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jarvis Mobile Edition</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at center,
            #06252c 0%,
            #02090d 40%,
            #000 80%
        );

    color:#00eaff;
    font-family:monospace;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:18px;
}


/* HEADER */

.header{
    text-align:center;
    padding:10px 0 18px;
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:7px;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff;
}

.subtitle{
    margin-top:6px;
    font-size:11px;
    letter-spacing:4px;
    color:#76f7ff;
}


/* CORE */

.core-area{
    display:flex;
    justify-content:center;
    align-items:center;

    margin:10px 0 15px;
}

.core{
    width:150px;
    height:150px;

    border:2px solid #00eaff;
    border-radius:50%;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,234,255,.35),
        inset 0 0 25px rgba(0,234,255,.25);

    animation:pulse 2.5s infinite;
}

.core::before{
    content:"";

    position:absolute;

    width:90px;
    height:90px;

    border:2px solid #00eaff;
    border-radius:50%;
}

.core::after{
    content:"";

    width:38px;
    height:38px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 15px #00eaff,
        0 0 35px #00eaff;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

.core-status{
    text-align:center;

    margin-bottom:20px;

    color:#00ffcc;

    font-size:12px;

    letter-spacing:4px;
}


/* PANELS */

.panel{
    border:1px solid #00eaff;

    padding:14px;

    margin-bottom:15px;

    background:rgba(0,20,25,.45);

    box-shadow:
        0 0 10px rgba(0,234,255,.12);
}

.panel-title{
    margin-bottom:12px;

    color:#fff;

    font-size:12px;

    letter-spacing:3px;
}


/* STATUS */

.status-row{
    display:flex;

    justify-content:space-between;

    padding:6px 0;

    font-size:12px;
}

.online{
    color:#00ff88;
}

.ready{
    color:#00eaff;
}


/* RESPONSE */

#reply{
    min-height:130px;

    border:1px solid #00eaff;

    padding:14px;

    color:#fff;

    line-height:1.6;

    white-space:pre-wrap;

    background:rgba(0,10,15,.65);
}


/* INPUT */

textarea{
    width:100%;

    min-height:90px;

    resize:vertical;

    background:#001015;

    color:#00eaff;

    border:1px solid #00eaff;

    padding:13px;

    font-family:monospace;

    font-size:14px;

    outline:none;
}


/* BUTTONS */

.button-row{
    display:flex;

    gap:10px;

    margin-top:10px;
}

button{
    flex:1;

    padding:14px;

    border:1px solid #00eaff;

    background:#00eaff;

    color:#001014;

    font-weight:bold;

    font-family:monospace;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,234,255,.4);
}

button:disabled{
    opacity:.6;
}

#micButton{
    flex:0 0 70px;

    font-size:18px;
}

.listening{
    background:#ff304f !important;

    border-color:#ff304f !important;

    color:#fff !important;
}


/* FOOTER */

.footer{
    text-align:center;

    margin-top:18px;

    font-size:10px;

    color:#4ecbd5;

    letter-spacing:2px;
}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <div class="logo">
        JARVIS
    </div>

    <div class="subtitle">
        MOBILE EDITION
    </div>

</div>


<!-- CORE -->

<div class="core-area">

    <div class="core"></div>

</div>

<div class="core-status">
    CORE ACTIVE
</div>


<!-- SYSTEM STATUS -->

<div class="panel">

    <div class="panel-title">
        SYSTEM STATUS
    </div>


    <div class="status-row">

        <span>AI CORE</span>

        <span
            id="brainStatus"
            class="online"
        >
            ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>NETWORK</span>

        <span class="online">
            ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>VOICE</span>

        <span
            id="voiceStatus"
            class="ready"
        >
            READY
        </span>

    </div>


    <div class="status-row">

        <span>MEMORY</span>

        <span class="ready">
            READY
        </span>

    </div>

</div>


<!-- RESPONSE -->

<div class="panel">

    <div class="panel-title">
        JARVIS RESPONSE
    </div>


    <div id="reply">
        Systems online.
        Awaiting your command, Vishnu.
    </div>

</div>


<!-- INPUT -->

<div class="panel">

    <div class="panel-title">
        ASK JARVIS
    </div>


    <textarea
        id="prompt"
        rows="4"
        placeholder="Type your message here..."
    ></textarea>


    <div class="button-row">

        <button
            id="sendButton"
            onclick="askJarvis()"
        >
            SEND
        </button>


        <button
            id="micButton"
            onclick="toggleListening()"
        >
            🎙️
        </button>

    </div>

</div>


<div class="footer">
    JARVIS ONLINE • SECURE AI CORE
</div>


</div>



<script>

/* =====================================================
   CLOUDFLARE WORKER
   ===================================================== */

const WORKER_URL =
"https://jarvis-api.vishnudutha8810.workers.dev";


/* =====================================================
   ELEMENTS
   ===================================================== */

const promptBox =
document.getElementById("prompt");

const replyBox =
document.getElementById("reply");

const brainStatus =
document.getElementById("brainStatus");

const voiceStatus =
document.getElementById("voiceStatus");

const sendButton =
document.getElementById("sendButton");

const micButton =
document.getElementById("micButton");


/* =====================================================
   VOICE
   ===================================================== */

let voices = [];

let jarvisVoice = null;


/* LOAD VOICES */

function loadVoices(){

    if(!("speechSynthesis" in window)){
        return;
    }

    voices =
        speechSynthesis.getVoices();


    jarvisVoice =
        findMaleVoice();

}


/* FIND MALE VOICE */

function findMaleVoice(){

    if(!voices.length){
        return null;
    }


    const preferred = [

        "Google UK English Male",

        "Microsoft George",

        "Microsoft Ryan",

        "Microsoft Guy",

        "Microsoft Daniel",

        "Daniel",

        "Alex",

        "Arthur",

        "James"

    ];


    for(
        const name of preferred
    ){

        const voice =
            voices.find(
                v =>
                v.name
                .toLowerCase()
                .includes(
                    name.toLowerCase()
                )
            );


        if(voice){
            return voice;
        }

    }


    return voices.find(
        v =>
        v.lang
        .toLowerCase()
        .startsWith("en")
    ) || null;

}


loadVoices();


if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        function(){

            loadVoices();

        };

}


/* =====================================================
   SPEAK
   ===================================================== */

function speakJarvis(text){

    if(
        !("speechSynthesis" in window)
    ){

        voiceStatus.textContent =
            "NOT SUPPORTED";

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
       Natural settings.

       Not artificially deep.
    */

    utterance.rate =
        0.94;

    utterance.pitch =
        0.90;

    utterance.volume =
        1;


    if(!jarvisVoice){

        jarvisVoice =
            findMaleVoice();

    }


    if(jarvisVoice){

        utterance.voice =
            jarvisVoice;

        utterance.lang =
            jarvisVoice.lang;

    }
    else{

        utterance.lang =
            "en-GB";

    }


    utterance.onstart =
        function(){

            voiceStatus.textContent =
                "SPEAKING";

        };


    utterance.onend =
        function(){

            voiceStatus.textContent =
                "READY";

        };


    utterance.onerror =
        function(){

            voiceStatus.textContent =
                "READY";

        };


    /*
       Speak immediately.
    */

    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   ASK JARVIS
   ===================================================== */

let processing =
    false;


async function askJarvis(){

    if(processing){
        return;
    }


    const message =
        promptBox.value.trim();


    if(!message){

        replyBox.textContent =
            "Please enter a message, Vishnu.";

        return;

    }


    processing =
        true;


    sendButton.disabled =
        true;


    sendButton.textContent =
        "THINKING...";


    brainStatus.textContent =
        "THINKING";


    replyBox.textContent =
        "Jarvis is thinking...";


    try{

        const response =
            await fetch(

                WORKER_URL,

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        prompt:
                            message

                    })

                }

            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error
                ||
                "Jarvis request failed."
            );

        }


        const reply =
            data.reply
            ||
            "Jarvis received no response.";


        /* SHOW TEXT */

        replyBox.textContent =
            reply;


        brainStatus.textContent =
            "ONLINE";


        /* SPEAK */

        speakJarvis(
            reply
        );


    }
    catch(error){

        brainStatus.textContent =
            "ERROR";


        replyBox.textContent =
            "Connection error:\n\n"
            +
            error.message;

    }
    finally{

        processing =
            false;


        sendButton.disabled =
            false;


        sendButton.textContent =
            "SEND";

    }

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

const SpeechRecognition =
    window.SpeechRecognition
    ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let listening =
    false;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.lang =
        "en-IN";


    recognition.onstart =
        function(){

            listening =
                true;


            micButton.textContent =
                "⏹️";


            micButton.classList.add(
                "listening"
            );


            voiceStatus.textContent =
                "LISTENING";

        };


    recognition.onresult =
        function(event){

            const text =
                event
                .results[0][0]
                .transcript;


            promptBox.value =
                text;


            /*
               Automatically send.
            */

            askJarvis();

        };


    recognition.onerror =
        function(event){

            console.log(
                "Speech recognition:",
                event.error
            );


            stopListening();

        };


    recognition.onend =
        function(){

            stopListening();

        };

}


/* =====================================================
   MICROPHONE
   ===================================================== */

function toggleListening(){

    if(!recognition){

        alert(
            "Speech recognition is not supported in this browser."
        );

        return;

    }


    if(listening){

        recognition.stop();

    }
    else{

        try{

            recognition.start();

        }
        catch(error){

            console.log(error);

        }

    }

}


/* =====================================================
   STOP LISTENING
   ===================================================== */

function stopListening(){

    listening =
        false;


    micButton.textContent =
        "🎙️";


    micButton.classList.remove(
        "listening"
    );


    if(
        voiceStatus.textContent ===
        "LISTENING"
    ){

        voiceStatus.textContent =
            "READY";

    }

}


/* =====================================================
   CTRL + ENTER
   ===================================================== */

promptBox.addEventListener(

    "keydown",

    function(event){

        if(
            event.key === "Enter"
            &&
            event.ctrlKey
        ){

            event.preventDefault();

            askJarvis();

        }

    }

);


/* =====================================================
   STARTUP
   ===================================================== */

window.addEventListener(

    "load",

    function(){

        loadVoices();

        brainStatus.textContent =
            "ONLINE";


        voiceStatus.textContent =
            SpeechRecognition
            ? "READY"
            : "NOT SUPPORTED";

    }

);

</script>


</body>

              </html>
