<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Jarvis - Mobile Edition</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at center,
            #06252c 0%,
            #02090d 40%,
            #000 78%
        );

    color:#00eaff;

    font-family:monospace;

    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:600px;

    margin:auto;

    padding:18px;
}


/* ==============================
   HEADER
   ============================== */

.header{
    text-align:center;

    padding:12px 0 18px;
}

.logo{
    font-size:32px;

    font-weight:bold;

    letter-spacing:7px;

    color:#00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 40px rgba(0,234,255,.5);
}

.subtitle{
    margin-top:6px;

    font-size:11px;

    letter-spacing:4px;

    color:#76f7ff;
}


/* ==============================
   CORE
   ============================== */

.core-area{
    display:flex;

    justify-content:center;
    align-items:center;

    margin:10px 0 18px;
}

.core{
    width:150px;
    height:150px;

    border:2px solid #00eaff;

    border-radius:50%;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,234,255,.35),
        inset 0 0 25px rgba(0,234,255,.25);

    animation:corePulse 2.5s infinite;
}

.core::before{
    content:"";

    position:absolute;

    width:90px;
    height:90px;

    border:2px solid #00eaff;

    border-radius:50%;
}

.core::after{
    content:"";

    width:38px;
    height:38px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 15px #00eaff,
        0 0 35px #00eaff;
}

@keyframes corePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

.core-status{
    text-align:center;

    margin-bottom:20px;

    color:#00ffcc;

    font-size:12px;

    letter-spacing:4px;
}


/* ==============================
   PANELS
   ============================== */

.panel{
    border:1px solid #00eaff;

    padding:14px;

    margin-bottom:15px;

    background:rgba(0,20,25,.45);

    box-shadow:
        0 0 10px rgba(0,234,255,.12);
}

.panel-title{
    margin-bottom:13px;

    color:#fff;

    font-size:12px;

    letter-spacing:3px;
}


/* ==============================
   SYSTEM STATUS
   ============================== */

.status-row{
    display:flex;

    justify-content:space-between;

    padding:6px 0;

    font-size:12px;
}

.online{
    color:#00ff88;
}

.ready{
    color:#00eaff;
}


/* ==============================
   RESPONSE
   ============================== */

#reply{
    min-height:130px;

    padding:14px;

    border:1px solid #00eaff;

    background:rgba(0,10,15,.65);

    color:#fff;

    line-height:1.6;

    white-space:pre-wrap;
}


/* ==============================
   TEXT INPUT
   ============================== */

textarea{
    width:100%;

    min-height:90px;

    resize:vertical;

    padding:13px;

    background:#001015;

    border:1px solid #00eaff;

    color:#00eaff;

    font-family:monospace;

    font-size:14px;

    outline:none;

    box-shadow:
        0 0 8px rgba(0,234,255,.15);
}

textarea:focus{
    box-shadow:
        0 0 15px rgba(0,234,255,.35);
}


/* ==============================
   BUTTONS
   ============================== */

.button-row{
    display:flex;

    gap:10px;

    margin-top:10px;
}

button{
    flex:1;

    padding:14px;

    border:1px solid #00eaff;

    background:#00eaff;

    color:#001014;

    font-family:monospace;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,234,255,.4);

    transition:.2s;
}

button:active{
    transform:scale(.97);
}

button:hover{
    box-shadow:
        0 0 20px rgba(0,234,255,.8);
}

#micButton{
    flex:0 0 70px;

    font-size:18px;
}


/* ==============================
   LISTENING
   ============================== */

.listening{
    background:#ff304f !important;

    border-color:#ff304f !important;

    color:#fff !important;

    box-shadow:
        0 0 20px rgba(255,48,79,.8) !important;
}


/* ==============================
   FOOTER
   ============================== */

.footer{
    margin-top:18px;

    text-align:center;

    font-size:10px;

    letter-spacing:2px;

    color:#4ecbd5;
}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
         ========================= -->

    <div class="header">

        <div class="logo">
            JARVIS
        </div>

        <div class="subtitle">
            MOBILE EDITION
        </div>

    </div>


    <!-- =========================
         CORE
         ========================= -->

    <div class="core-area">

        <div class="core"></div>

    </div>


    <div class="core-status">
        CORE ACTIVE
    </div>


    <!-- =========================
         SYSTEM STATUS
         ========================= -->

    <div class="panel">

        <div class="panel-title">
            SYSTEM STATUS
        </div>


        <div class="status-row">

            <span>
                AI CORE
            </span>

            <span
                id="brainStatus"
                class="online"
            >
                ONLINE
            </span>

        </div>


        <div class="status-row">

            <span>
                NETWORK
            </span>

            <span class="online">
                ONLINE
            </span>

        </div>


        <div class="status-row">

            <span>
                VOICE
            </span>

            <span
                id="voiceStatus"
                class="ready"
            >
                READY
            </span>

        </div>


        <div class="status-row">

            <span>
                MEMORY
            </span>

            <span class="ready">
                READY
            </span>

        </div>

    </div>


    <!-- =========================
         RESPONSE
         ========================= -->

    <div class="panel">

        <div class="panel-title">
            JARVIS RESPONSE
        </div>


        <div id="reply">
            Systems online.
            Awaiting your command, Vishnu.
        </div>

    </div>


    <!-- =========================
         ASK JARVIS
         ========================= -->

    <div class="panel">

        <div class="panel-title">
            ASK JARVIS
        </div>


        <textarea
            id="prompt"
            placeholder="Type your message here..."
        ></textarea>


        <div class="button-row">

            <button
                onclick="askJarvis()"
            >
                SEND
            </button>


            <button
                id="micButton"
                onclick="toggleListening()"
            >
                🎙️
            </button>

        </div>

    </div>


    <div class="footer">
        JARVIS ONLINE • SECURE AI CORE
    </div>


</div>



<script>

/* =====================================================
   CLOUDFLARE WORKER
   ===================================================== */

const WORKER_URL =
"https://jarvis-api-594e.vishnudutha8810.workers.dev";


/* =====================================================
   DOM
   ===================================================== */

const promptBox =
document.getElementById("prompt");

const replyBox =
document.getElementById("reply");

const micButton =
document.getElementById("micButton");

const brainStatus =
document.getElementById("brainStatus");

const voiceStatus =
document.getElementById("voiceStatus");


/* =====================================================
   VOICE VARIABLES
   ===================================================== */

let availableVoices = [];

let selectedJarvisVoice = null;

let isSpeaking = false;


/* =====================================================
   LOAD VOICES
   ===================================================== */

function loadVoices(){

    if(!("speechSynthesis" in window)){
        return;
    }


    availableVoices =
        window.speechSynthesis.getVoices();


    selectedJarvisVoice =
        findBestMaleVoice();

}


/* =====================================================
   FIND BEST MALE VOICE
   ===================================================== */

function findBestMaleVoice(){

    if(!availableVoices.length){
        return null;
    }


    const preferredVoices = [

        "Google UK English Male",

        "Microsoft George",

        "Microsoft Ryan Online",

        "Microsoft Guy Online",

        "Microsoft Daniel Online",

        "Microsoft William Online",

        "Daniel",

        "Alex",

        "Arthur",

        "James"

    ];


    /* Preferred voices */

    for(
        const name
        of preferredVoices
    ){

        const found =
            availableVoices.find(

                voice =>

                voice.name
                    .toLowerCase()
                    .includes(
                        name.toLowerCase()
                    )

            );


        if(found){
            return found;
        }

    }


    /* Other male English voices */

    const maleNames = [

        "George",
        "Ryan",
        "Guy",
        "Daniel",
        "David",
        "James",
        "Arthur",
        "Alex",
        "Thomas",
        "Brian"

    ];


    for(
        const name
        of maleNames
    ){

        const found =
            availableVoices.find(

                voice =>

                voice.lang
                    .toLowerCase()
                    .startsWith("en")

                &&

                voice.name
                    .toLowerCase()
                    .includes(
                        name.toLowerCase()
                    )

            );


        if(found){
            return found;
        }

    }


    /* English fallback */

    return (

        availableVoices.find(

            voice =>
            voice.lang
                .toLowerCase()
                .startsWith("en")

        )

        ||

        null

    );

}


/* Load immediately */

loadVoices();


/* Chrome loads voices asynchronously */

if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        function(){

            loadVoices();

        };

}


/* =====================================================
   SPEAK JARVIS
   ===================================================== */

function speakJarvis(text){

    if(!("speechSynthesis" in window)){

        voiceStatus.textContent =
            "NOT SUPPORTED";

        return;

    }


    if(!text){
        return;
    }


    /*
       Stop previous speech.
    */

    window.speechSynthesis.cancel();


    /*
       Keep the name as plain "Jarvis".

       No dots.
       No spelling.
       No X.
    */

    const cleanText =
        text;


    /*
       Create speech.
    */

    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    /*
       Voice settings.

       Slightly slower + lower pitch
       for an assistant-style male sound.
    */

    utterance.rate =
        0.92;

    utterance.pitch =
        0.78;

    utterance.volume =
        1;


    /*
       Try English voice.
    */

    utterance.lang =
        "en-GB";


    /*
       Re-check available voices.
    */

    if(!selectedJarvisVoice){

        selectedJarvisVoice =
            findBestMaleVoice();

    }


    if(selectedJarvisVoice){

        utterance.voice =
            selectedJarvisVoice;

        utterance.lang =
            selectedJarvisVoice.lang;

    }


    /* Speech starts */

    utterance.onstart =
        function(){

            isSpeaking =
                true;

            voiceStatus.textContent =
                "SPEAKING";

        };


    /* Speech finished */

    utterance.onend =
        function(){

            isSpeaking =
                false;

            voiceStatus.textContent =
                "READY";

        };


    /* Speech error */

    utterance.onerror =
        function(){

            isSpeaking =
                false;

            voiceStatus.textContent =
                "READY";

        };


    /*
       Start immediately.
    */

    window.speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   ASK JARVIS
   ===================================================== */

let isProcessing = false;


async function askJarvis(){

    if(isProcessing){
        return;
    }


    const userPrompt =
        promptBox.value.trim();


    if(!userPrompt){

        replyBox.textContent =
            "Please enter a message, Vishnu.";

        return;

    }


    isProcessing =
        true;


    brainStatus.textContent =
        "THINKING";


    replyBox.textContent =
        "Jarvis is thinking...";


    try{


        /* =============================
           SEND TO CLOUDFLARE
           ============================= */

        const response =
            await fetch(

                WORKER_URL,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        prompt:
                            userPrompt

                    })

                }

            );


        const
