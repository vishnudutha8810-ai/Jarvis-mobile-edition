<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>J.A.R.V.I.S X</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #062b35 0%, #02090d 35%, #000 75%);
      color: #00ffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 20px 10px;
      border-bottom: 1px solid #00ffff55;
    }

    .title {
      font-size: 38px;
      letter-spacing: 8px;
      font-weight: bold;
      text-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;
    }

    .subtitle {
      margin-top: 8px;
      color: #8fffff;
      font-size: 13px;
      letter-spacing: 3px;
    }

    .status {
      margin: 20px auto;
      width: fit-content;
      padding: 10px 20px;
      border: 1px solid #00ffff;
      border-radius: 25px;
      box-shadow: 0 0 15px #00ffff55;
      font-weight: bold;
    }

    .online {
      color: #00ff99;
    }

    .offline {
      color: #ff4444;
    }

    .core {
      width: 150px;
      height: 150px;
      margin: 30px auto;
      border: 2px solid #00ffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 20px #00ffff,
        0 0 60px #0088ff55,
        inset 0 0 30px #00ffff55;
      animation: pulse 2s infinite;
    }

    .core-inner {
      width: 75px;
      height: 75px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      letter-spacing: 2px;
      box-shadow: 0 0 20px #ffffff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    .panel {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #00ffff66;
      border-radius: 15px;
      background: #001217aa;
      box-shadow: 0 0 25px #00ffff22;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #8fffff;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 15px;
      background: #000b0f;
      color: #00ffff;
      border: 1px solid #00ffff;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    textarea:focus {
      box-shadow: 0 0 15px #00ffff55;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #00ffff;
      color: #001014;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      box-shadow: 0 0 20px #00ffff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .reply-title {
      color: #00ffff;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #reply {
      min-height: 120px;
      padding: 15px;
      border: 1px solid #00ffff55;
      border-radius: 10px;
      background: #00080c;
      color: white;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: #557777;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 28px;
        letter-spacing: 5px;
      }

      .core {
        width: 120px;
        height: 120px;
      }

      .core-inner {
        width: 60px;
        height: 60px;
      }

      .container {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="title">J.A.R.V.I.S X</div>
      <div class="subtitle">PERSONAL ARTIFICIAL INTELLIGENCE</div>
    </div>

    <div id="status" class="status online">
      ● BRAIN: ONLINE
    </div>

    <div class="core">
      <div class="core-inner">
        JARVIS
      </div>
    </div>

    <div class="panel">

      <label for="prompt">
        ENTER COMMAND / QUESTION
      </label>

      <textarea
        id="prompt"
        placeholder="Ask JARVIS anything..."
      ></textarea>

      <button id="sendButton" onclick="askJarvis()">
        SEND TO JARVIS
      </button>

    </div>

    <div class="panel">

      <div class="reply-title">
        🤖 JARVIS RESPONSE
      </div>

      <div id="reply">
        Waiting for your command...
      </div>

    </div>

    <div class="footer">
      J.A.R.V.I.S X • Secure Cloud Backend
    </div>

  </div>


  <script>

    /*
      IMPORTANT:
      No Gemini API key is stored in this website.

      The request goes to our Cloudflare Worker.
      The Gemini API key stays safely inside
      Cloudflare Worker Secrets.
    */

    const WORKER_URL =
      "https://jarvis-api-594e.vishnudutha8810.workers.dev";


    async function askJarvis() {

      const promptBox = document.getElementById("prompt");
      const replyBox = document.getElementById("reply");
      const button = document.getElementById("sendButton");
      const status = document.getElementById("status");

      const prompt = promptBox.value.trim();

      if (!prompt) {
        replyBox.textContent =
          "Please enter a question or command.";
        return;
      }


      button.disabled = true;
      button.textContent = "JARVIS IS THINKING...";

      status.textContent = "● BRAIN: PROCESSING";
      status.className = "status online";

      replyBox.textContent =
        "Connecting to JARVIS X secure backend...";


      try {

        const response = await fetch(WORKER_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: prompt
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "Backend request failed."
          );

        }


        replyBox.textContent =
          data.reply || "JARVIS returned no response.";

        status.textContent =
          "● BRAIN: ONLINE";

        status.className =
          "status online";

      }

      catch (error) {

        console.error(error);

        replyBox.textContent =
          "JARVIS CONNECTION ERROR\n\n" +
          error.message;

        status.textContent =
          "● BRAIN: CONNECTION ERROR";

        status.className =
          "status offline";

      }

      finally {

        button.disabled = false;

        button.textContent =
          "SEND TO JARVIS";

      }

    }


    /*
      Press Enter with Ctrl/Command
      to send the question.
    */

    document
      .getElementById("prompt")
      .addEventListener("keydown", function(event) {

        if (
          event.key === "Enter" &&
          (event.ctrlKey || event.metaKey)
        ) {

          askJarvis();

        }

      });

  </script>

</body>
</html>
