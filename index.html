<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jarvis Mobile Edition</title>


<style>

/* =========================
   BASIC
   ========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at center,
            #06252c 0%,
            #02090d 40%,
            #000 80%
        );

    color:#00eaff;

    font-family:monospace;

    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:600px;

    margin:auto;

    padding:18px;
}


/* =========================
   HEADER
   ========================= */

.header{
    text-align:center;

    padding:10px 0 18px;
}

.logo{
    font-size:32px;

    font-weight:bold;

    letter-spacing:7px;

    color:#00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 40px rgba(0,234,255,.5);
}

.subtitle{
    margin-top:6px;

    font-size:11px;

    letter-spacing:4px;

    color:#76f7ff;
}


/* =========================
   CORE
   ========================= */

.core-area{
    display:flex;

    justify-content:center;
    align-items:center;

    margin:10px 0 15px;
}

.core{
    width:150px;
    height:150px;

    border:2px solid #00eaff;

    border-radius:50%;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,234,255,.35),
        inset 0 0 25px rgba(0,234,255,.25);

    animation:pulse 2.5s infinite;
}

.core::before{
    content:"";

    position:absolute;

    width:90px;
    height:90px;

    border:2px solid #00eaff;

    border-radius:50%;
}

.core::after{
    content:"";

    width:38px;
    height:38px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 15px #00eaff,
        0 0 35px #00eaff;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}

.core-status{
    text-align:center;

    margin-bottom:20px;

    color:#00ffcc;

    font-size:12px;

    letter-spacing:4px;
}


/* =========================
   PANELS
   ========================= */

.panel{
    border:1px solid #00eaff;

    padding:14px;

    margin-bottom:15px;

    background:rgba(0,20,25,.45);

    box-shadow:
        0 0 10px rgba(0,234,255,.12);
}

.panel-title{
    margin-bottom:13px;

    color:#fff;

    font-size:12px;

    letter-spacing:3px;
}


/* =========================
   STATUS
   ========================= */

.status-row{
    display:flex;

    justify-content:space-between;

    padding:6px 0;

    font-size:12px;
}

.online{
    color:#00ff88;
}

.ready{
    color:#00eaff;
}


/* =========================
   RESPONSE
   ========================= */

#reply{
    min-height:130px;

    padding:14px;

    border:1px solid #00eaff;

    background:rgba(0,10,15,.65);

    color:#fff;

    line-height:1.6;

    white-space:pre-wrap;
}


/* =========================
   INPUT
   ========================= */

textarea{
    width:100%;

    min-height:90px;

    resize:vertical;

    padding:13px;

    background:#001015;

    border:1px solid #00eaff;

    color:#00eaff;

    font-family:monospace;

    font-size:14px;

    outline:none;
}

textarea:focus{
    box-shadow:
        0 0 15px rgba(0,234,255,.35);
}


/* =========================
   BUTTONS
   ========================= */

.button-row{
    display:flex;

    gap:10px;

    margin-top:10px;
}

button{
    flex:1;

    padding:14px;

    border:1px solid #00eaff;

    background:#00eaff;

    color:#001014;

    font-family:monospace;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,234,255,.4);
}

button:active{
    transform:scale(.97);
}

#micButton{
    flex:0 0 70px;

    font-size:18px;
}


/* =========================
   LISTENING
   ========================= */

.listening{
    background:#ff304f !important;

    border-color:#ff304f !important;

    color:#fff !important;

    box-shadow:
        0 0 20px rgba(255,48,79,.8) !important;
}


/* =========================
   FOOTER
   ========================= */

.footer{
    margin-top:18px;

    text-align:center;

    font-size:10px;

    letter-spacing:2px;

    color:#4ecbd5;
}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <div class="logo">
        JARVIS
    </div>

    <div class="subtitle">
        MOBILE EDITION
    </div>

</div>



<!-- =========================
     CORE
     ========================= -->

<div class="core-area">

    <div class="core"></div>

</div>


<div class="core-status">
    CORE ACTIVE
</div>



<!-- =========================
     SYSTEM STATUS
     ========================= -->

<div class="panel">

    <div class="panel-title">
        SYSTEM STATUS
    </div>


    <div class="status-row">

        <span>AI CORE</span>

        <span
            id="brainStatus"
            class="online"
        >
            ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>NETWORK</span>

        <span class="online">
            ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>VOICE</span>

        <span
            id="voiceStatus"
            class="ready"
        >
            READY
        </span>

    </div>


    <div class="status-row">

        <span>MEMORY</span>

        <span class="ready">
            READY
        </span>

    </div>

</div>



<!-- =========================
     RESPONSE
     ========================= -->

<div class="panel">

    <div class="panel-title">
        JARVIS RESPONSE
    </div>


    <div id="reply">
        Systems online.
        Awaiting your command, Vishnu.
    </div>

</div>



<!-- =========================
     ASK JARVIS
     ========================= -->

<div class="panel">

    <div class="panel-title">
        ASK JARVIS
    </div>


    <textarea
        id="prompt"
        placeholder="Type your message here..."
    ></textarea>


    <div class="button-row">

        <button
            id="sendButton"
            onclick="askJarvis()"
        >
            SEND
        </button>


        <button
            id="micButton"
            onclick="toggleListening()"
        >
            🎙️
        </button>

    </div>

</div>



<div class="footer">
    JARVIS ONLINE • SECURE AI CORE
</div>


</div>



<script>

/* =====================================================
   CLOUDFLARE WORKER URL
   ===================================================== */

const WORKER_URL =
"https://jarvis-api.vishnudutha8810.workers.dev";



/* =====================================================
   ELEMENTS
   ===================================================== */

const promptBox =
document.getElementById("prompt");

const replyBox =
document.getElementById("reply");

const brainStatus =
document.getElementById("brainStatus");

const voiceStatus =
document.getElementById("voiceStatus");

const micButton =
document.getElementById("micButton");

const sendButton =
document.getElementById("sendButton");



/* =====================================================
   PROCESSING
   ===================================================== */

let isProcessing = false;



/* =====================================================
   VOICE SYSTEM
   ===================================================== */

let availableVoices = [];

let jarvisVoice = null;



/* =====================================================
   LOAD VOICES
   ===================================================== */

function loadVoices(){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    availableVoices =
        window.speechSynthesis.getVoices();


    jarvisVoice =
        findJarvisVoice();

}



/* =====================================================
   FIND MALE ENGLISH VOICE
   ===================================================== */

function findJarvisVoice(){

    if(
        availableVoices.length === 0
    ){
        return null;
    }


    const preferred = [

        "Google UK English Male",

        "Microsoft George",

        "Microsoft Ryan",

        "Microsoft Guy",

        "Microsoft Daniel",

        "Daniel",

        "Alex",

        "Arthur",

        "James"

    ];


    for(
        const name of preferred
    ){

        const voice =
            availableVoices.find(
                v =>
                v.name
                .toLowerCase()
                .includes(
                    name.toLowerCase()
                )
            );


        if(voice){
            return voice;
        }

    }


    return availableVoices.find(
        v =>
        v.lang
        .toLowerCase()
        .startsWith("en")
    ) || null;

}



/* =====================================================
   INITIALIZE VOICES
   ===================================================== */

loadVoices();


if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        function(){

            loadVoices();

        };

}



/* =====================================================
   SPEAK JARVIS
   ===================================================== */

function speakJarvis(text){

    if(
        !("speechSynthesis" in window)
    ){

        voiceStatus.textContent =
            "NOT SUPPORTED";

        return;

    }


    if(!text){
        return;
    }


    /*
       Stop anything already speaking.
    */

    window.speechSynthesis.cancel();


    /*
       Keep Jarvis as a normal word.
    */

    const speechText =
        text;


    const utterance =
        new SpeechSynthesisUtterance(
            speechText
        );


    /*
       Natural assistant-style voice.
    */

    utterance.rate =
        0.92;

    utterance.pitch =
        0.78;

    utterance.volume =
        1;


    utterance.lang =
        "en-GB";


    /*
       Select available male voice.
    */

    if(!jarvisVoice){

        jarvisVoice =
            findJarvisVoice();

    }


    if(jarvisVoice){

        utterance.voice =
            jarvisVoice;

        utterance.lang =
            jarvisVoice.lang;

    }


    utterance.onstart =
        function(){

            voiceStatus.textContent =
                "SPEAKING";

        };


    utterance.onend =
        function(){

            voiceStatus.textContent =
                "READY";

        };


    utterance.onerror =
        function(){

            voiceStatus.textContent =
                "READY";

        };


    /*
       Speak immediately.
    */

    window.speechSynthesis.speak(
        utterance
    );

}



/* =====================================================
   ASK JARVIS
   ===================================================== */

async function askJarvis(){

    if(isProcessing){
        return;
    }


    const userPrompt =
        promptBox.value.trim();


    if(!userPrompt){

        replyBox.textContent =
            "Please enter a message, Vishnu.";

        return;

    }


    isProcessing =
        true;


    sendButton.disabled =
        true;


    sendButton.textContent =
        "THINKING...";


    brainStatus.textContent =
        "THINKING";


    replyBox.textContent =
        "Jarvis is thinking...";


    try{


        /* =============================
           SEND TO NEW WORKER
           ============================= */

        const response =
            await fetch(

                WORKER_URL,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        prompt:
                            userPrompt

                    })

                }

            );


        /* =============================
           READ RESPONSE
           ============================= */

        const data =
            await response.json();


        /* =============================
           CHECK SERVER ERROR
           ============================= */

        if(!response.ok){

            throw new Error(

                data.error
                ||
                "Jarvis request failed."

            );

        }


        /* =============================
           GET JARVIS REPLY
           ============================= */

        const jarvisReply =
            data.reply
            ||
            "Jarvis received no response.";


        /* =============================
           SHOW REPLY
           ============================= */

        replyBox.textContent =
            jarvisReply;


        brainStatus.textContent =
            "ONLINE";


        /* =============================
           VOICE
           ============================= */

        speakJarvis(
            jarvisReply
        );


    }
    catch(error){

        brainStatus.textContent =
            "ERROR";


        replyBox.textContent =
            "Connection error:\n\n"
            +
            error.message;

    }
    finally{

        isProcessing =
            false;


        sendButton.disabled =
            false;


        sendButton.textContent =
            "SEND";

    }

}



/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

const SpeechRecognition =
    window.SpeechRecognition
    ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;



if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    /*
       Indian English recognition.
    */

    recognition.lang =
        "en-IN";


    recognition.onstart =
        function(){

            isListening =
                true;


            micButton.textContent =
                "⏹️";


            micButton.classList.add(
                "listening"
            );


            voiceStatus.textContent =
                "LISTENING";

        };


    recognition.onresult =
        function(event){

            const transcript =
                event
                .results[0][0]
                .transcript;


            promptBox.value =
                transcript;


            /*
               Automatically send
               voice command.
            */

            askJarvis();

        };


    recognition.onerror =
        function(event){

            console.log(
                "Speech error:",
                event.error
            );


            stopListening();

        };


    recognition.onend =
        function(){

            stopListening();

        };

}



/* =====================================================
   MICROPHONE
   ===================================================== */

function toggleListening(){

    if(!recognition){

        alert(
            "Speech recognition is not supported in this browser."
        );

        return;

    }


    if(isListening){

        recognition.stop();

        return;

    }


    try{

        recognition.start();

    }
    catch(error){

        console.log(error);

    }

}



/* =====================================================
   STOP MICROPHONE
   ===================================================== */

function stopListening(){

    isListening =
        false;


    micButton.textContent =
        "🎙️";


    micButton.classList.remove(
        "listening"
    );


    if(
        voiceStatus.textContent ===
        "LISTENING"
    ){

        voiceStatus.textContent =
            "READY";

    }

}



/* =====================================================
   CTRL + ENTER
   ===================================================== */

promptBox.addEventListener(

    "keydown",

    function(event){

        if(
            event.key === "Enter"
            &&
            event.ctrlKey
        ){

            event.preventDefault();

            askJarvis();

        }

    }

);



/* =====================================================
   STARTUP
   ===================================================== */

window.addEventListener(

    "load",

    function(){

        loadVoices();

        brainStatus.textContent =
            "ONLINE";

        voiceStatus.textContent =
            (
                SpeechRecognition
                ? "READY"
                : "NOT SUPPORTED"
            );

    }

);

</script>

</body>

</html>
