<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S X</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #000;

    color: #00ffff;

    font-family:
        "Courier New",
        monospace;

}

body {

    overflow-x: hidden;

}


.app {

    width: 100%;

    max-width: 520px;

    margin: auto;

    padding: 18px 14px 35px;

}


/* HEADER */

.header {

    text-align: center;

    padding:
        8px 0 18px;

    border-bottom:
        1px solid #073f43;

}

.logo {

    font-size: 30px;

    font-weight: bold;

    letter-spacing: 7px;

    color: #00ffff;

    text-shadow:
        0 0 8px #00ffff,
        0 0 20px #00ffff,
        0 0 35px #00ffff;

}

.edition {

    margin-top: 7px;

    font-size: 10px;

    letter-spacing: 4px;

    color: #5bdede;

}


/* CORE */

.core-section {

    text-align: center;

    padding:
        25px 0 20px;

}

.core {

    position: relative;

    width: 145px;

    height: 145px;

    margin: auto;

    border:
        2px solid #00ffff;

    border-radius: 50%;

    box-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff,
        inset 0 0 25px #00ffff55;

    animation:
        corePulse 2.5s infinite
        ease-in-out;

}

.core::before {

    content: "";

    position: absolute;

    inset: 13px;

    border:
        2px solid #00ffff;

    border-radius: 50%;

    box-shadow:
        0 0 15px #00ffff;

}

.core::after {

    content: "";

    position: absolute;

    inset: 30px;

    border:
        2px solid white;

    border-radius: 50%;

    box-shadow:
        0 0 10px white,
        inset 0 0 15px #ffffff55;

}

.core-center {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 3;

    color: white;

    font-size: 11px;

    letter-spacing: 3px;

}

.core-status {

    margin-top: 15px;

    color: #66ffff;

    font-size: 10px;

    letter-spacing: 4px;

}


@keyframes corePulse {

    0%,100% {

        transform: scale(1);

        filter: brightness(1);

    }

    50% {

        transform: scale(1.04);

        filter: brightness(1.3);

    }

}


/* STATUS */

.panel {

    border:
        1px solid #07575a;

    background:
        #010a0c;

    box-shadow:
        0 0 15px #00ffff15,
        inset 0 0 20px #00ffff08;

    margin-top: 15px;

    padding: 16px;

}

.panel-title {

    color: #00ffff;

    font-size: 13px;

    letter-spacing: 3px;

    margin-bottom: 13px;

}

.status-row {

    display: flex;

    justify-content: space-between;

    padding: 5px 0;

    font-size: 11px;

    letter-spacing: 1px;

}

.online {

    color: #00ff66;

    text-shadow:
        0 0 8px #00ff66;

}

.locked {

    color: #ff304f;

    text-shadow:
        0 0 8px #ff304f;

}


/* RESPONSE */

.chat-box {

    min-height: 180px;

    max-height: 380px;

    overflow-y: auto;

    border:
        1px solid #06484c;

    background:
        #000607;

    padding: 14px;

    color: #dfffff;

    font-family:
        Arial,
        sans-serif;

    font-size: 14px;

    line-height: 1.6;

    white-space: pre-wrap;

}

.waiting {

    color: #496d70;

    text-align: center;

    padding-top: 55px;

}


/* COMMAND */

.input-area {

    margin-top: 15px;

    display: flex;

    gap: 7px;

}

#prompt {

    flex: 1;

    min-width: 0;

    height: 46px;

    background:
        #010a0c;

    color: #00ffff;

    border:
        1px solid #00ffff;

    padding: 10px;

    outline: none;

    font-family:
        "Courier New",
        monospace;

    font-size: 13px;

}

#prompt::placeholder {

    color: #527174;

}


/* MIC */

#mic {

    width: 52px;

    height: 46px;

    border:
        1px solid #00ffff;

    background:
        #00191d;

    color: #00ffff;

    font-size: 20px;

    cursor: pointer;

}

#mic:hover {

    box-shadow:
        0 0 15px #00ffff;

}

#mic.listening {

    background:
        #ff304f;

    border-color:
        #ff304f;

    color: white;

    box-shadow:
        0 0 20px #ff304f;

}


/* SEND */

#send {

    width: 72px;

    height: 46px;

    border:
        1px solid #00ffff;

    background:
        #00ffff;

    color: #000;

    font-weight: bold;

    font-family:
        "Courier New",
        monospace;

    cursor: pointer;

}

#send:disabled {

    opacity: 0.5;

    cursor: wait;

}


/* VOICE STATUS */

#voiceStatus {

    margin-top: 10px;

    text-align: center;

    font-size: 10px;

    letter-spacing: 2px;

    color: #557777;

}


/* FOOTER */

.footer {

    text-align: center;

    margin-top: 22px;

    color: #24484b;

    font-size: 9px;

    letter-spacing: 2px;

}


@media (max-width: 360px) {

    .logo {

        font-size: 25px;

        letter-spacing: 5px;

    }

    .core {

        width: 125px;

        height: 125px;

    }

    #mic {

        width: 48px;

    }

    #send {

        width: 65px;

    }

}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<header class="header">

    <div class="logo">
        J.A.R.V.I.S
    </div>

    <div class="edition">
        MOBILE EDITION
    </div>

</header>


<!-- CORE -->

<section class="core-section">

    <div class="core">

        <div class="core-center">
            JARVIS
        </div>

    </div>

    <div class="core-status">
        CORE ACTIVE
    </div>

</section>


<!-- SYSTEM STATUS -->

<section class="panel">

    <div class="panel-title">
        SYSTEM STATUS
    </div>

    <div class="status-row">

        <span>AI CORE</span>

        <span class="online">
            ● ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>NETWORK</span>

        <span class="online">
            ● ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>VOICE</span>

        <span id="voiceState"
              class="online">

            ● READY

        </span>

    </div>


    <div class="status-row">

        <span>MEMORY</span>

        <span class="locked">
            ● LOCKED
        </span>

    </div>

</section>


<!-- RESPONSE -->

<section class="panel">

    <div class="panel-title">
        J.A.R.V.I.S RESPONSE
    </div>


    <div id="reply"
         class="chat-box">

        <div class="waiting">
            Waiting for your command...
        </div>

    </div>

</section>


<!-- COMMAND -->

<section class="panel">

    <div class="panel-title">
        COMMAND CENTER
    </div>


    <div class="input-area">


        <input
            id="prompt"
            type="text"
            placeholder="Ask J.A.R.V.I.S..."
            autocomplete="off"
        >


        <button
            id="mic"
            type="button"
            onclick="startListening()">

            🎙️

        </button>


        <button
            id="send"
            type="button"
            onclick="askJarvis()">

            SEND

        </button>


    </div>


    <div id="voiceStatus">

        VOICE READY

    </div>

</section>


<div class="footer">

    J.A.R.V.I.S X • MOBILE EDITION

</div>


</div>



<script>


/*
==================================================
J.A.R.V.I.S X
SECURE CLOUD BACKEND
==================================================

Website
   ↓
Cloudflare Worker
   ↓
Gemini API

NO GEMINI API KEY IN THIS FILE.

==================================================
*/


const WORKER_URL =
"https://jarvis-api-594e.vishnudutha8810.workers.dev";



/*
==================================================
VOICE RECOGNITION
==================================================
*/


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;



if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-IN";


    recognition.onstart = function() {

        isListening = true;

        document
            .getElementById("mic")
            .classList.add("listening");

        document
            .getElementById("voiceStatus")
            .textContent =
            "🎙️ LISTENING...";

        document
            .getElementById("voiceState")
            .textContent =
            "● LISTENING";

    };


    recognition.onresult =
    function(event) {

        const transcript =
            event.results[0][0].transcript;


        document
            .getElementById("prompt")
            .value =
            transcript;


        document
            .getElementById("voiceStatus")
            .textContent =
            "VOICE RECEIVED";


        /*
        Automatically send
        recognized speech to JARVIS.
        */

        askJarvis();

    };


    recognition.onerror =
    function(event) {

        console.error(
            "Speech recognition error:",
            event.error
        );


        document
            .getElementById("voiceStatus")
            .textContent =
            "VOICE ERROR: " +
            event.error;

    };


    recognition.onend =
    function() {

        isListening = false;


        document
            .getElementById("mic")
            .classList.remove("listening");


        document
            .getElementById("voiceState")
            .textContent =
            "● READY";

    };

}



/*
==================================================
START MICROPHONE
==================================================
*/


function startListening() {


    if (!recognition) {

        alert(
            "Voice recognition is not supported in this browser. Please use Chrome."
        );

        return;

    }


    if (isListening) {

        recognition.stop();

        return;

    }


    document
        .getElementById("voiceStatus")
        .textContent =
        "REQUESTING MICROPHONE...";


    recognition.start();

}



/*
==================================================
JARVIS TEXT → GEMINI
==================================================
*/


async function askJarvis() {


    const input =
        document.getElementById("prompt");


    const reply =
        document.getElementById("reply");


    const button =
        document.getElementById("send");


    const prompt =
        input.value.trim();


    if (!prompt) {

        reply.innerHTML =
            '<div class="waiting">Please enter a command...</div>';

        return;

    }


    button.disabled = true;

    button.textContent = "...";


    reply.textContent =
        "JARVIS is processing your request...";


    try {


        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        prompt: prompt

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Backend request failed."
            );

        }


        const jarvisReply =
            data.reply ||
            "JARVIS returned no response.";


        reply.textContent =
            jarvisReply;


        /*
        🔊 JARVIS VOICE OUTPUT
        */

        speakJarvis(
            jarvisReply
        );


    }


    catch (error) {


        console.error(error);


        reply.textContent =
            "JARVIS CONNECTION ERROR\n\n" +
            error.message;

    }


    finally {


        button.disabled = false;

        button.textContent =
            "SEND";

    }

}



/*
==================================================
TEXT → SPEECH
==================================================
*/


function speakJarvis(text) {


    if (!("speechSynthesis" in window)) {

        console.log(
            "Speech synthesis not supported."
        );

        return;

    }


    window
        .speechSynthesis
        .cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    /*
    Indian English voice.
    Browser will choose the
    closest available voice.
    */

    speech.lang = "en-IN";


    speech.rate = 0.95;

    speech.pitch = 0.85;

    speech.volume = 1;


    speech.onstart =
    function() {

        document
            .getElementById("voiceStatus")
            .textContent =
            "🔊 JARVIS SPEAKING...";

        document
            .getElementById("voiceState")
            .textContent =
            "● SPEAKING";

    };


    speech.onend =
    function() {

        document
            .getElementById("voiceStatus")
            .textContent =
            "VOICE READY";

        document
            .getElementById("voiceState")
            .textContent =
            "● READY";

    };


    window
        .speechSynthesis
        .speak(speech);

}



/*
==================================================
ENTER KEY
==================================================
*/


document
    .getElementById("prompt")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                askJarvis();

            }

        }
    );


</script>


</body>

  </html>
