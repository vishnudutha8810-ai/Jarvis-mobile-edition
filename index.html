<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jarvis Mobile Edition</title>

<style>

/* =========================
   RESET
   ========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 15%,
            #06323a 0%,
            #021217 35%,
            #000 75%
        );

    color: #00eaff;

    font-family: monospace;

    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 620px;

    margin: auto;

    padding: 16px;
}


/* =========================
   HEADER
   ========================= */

.header {
    text-align: center;

    padding: 8px 0 12px;
}

.logo {
    font-size: 34px;

    font-weight: bold;

    letter-spacing: 7px;

    color: #00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 40px rgba(0,234,255,0.45);
}

.subtitle {
    margin-top: 6px;

    font-size: 11px;

    letter-spacing: 4px;

    color: #7df8ff;
}


/* =========================
   CORE
   ========================= */

.core-area {
    display: flex;

    justify-content: center;
    align-items: center;

    margin: 5px 0 8px;
}

.core {
    width: 145px;
    height: 145px;

    border: 2px solid #00eaff;

    border-radius: 50%;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        0 0 15px #00eaff,
        0 0 35px rgba(0,234,255,0.35),
        inset 0 0 25px rgba(0,234,255,0.25);

    animation:
        corePulse 3s infinite;
}

.core::before {
    content: "";

    position: absolute;

    width: 88px;
    height: 88px;

    border: 2px solid #00eaff;

    border-radius: 50%;

    box-shadow:
        0 0 15px rgba(0,234,255,0.5);
}

.core::after {
    content: "";

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #00eaff;

    box-shadow:
        0 0 12px #00eaff,
        0 0 30px #00eaff,
        0 0 50px rgba(0,234,255,0.7);
}

@keyframes corePulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }
}

.core-status {
    text-align: center;

    margin-bottom: 18px;

    color: #00ffcc;

    font-size: 12px;

    letter-spacing: 4px;
}


/* =========================
   PANELS
   ========================= */

.panel {
    border: 1px solid #00eaff;

    padding: 14px;

    margin-bottom: 14px;

    background:
        rgba(0, 18, 24, 0.55);

    box-shadow:
        0 0 12px rgba(0,234,255,0.12);
}

.panel-title {
    margin-bottom: 14px;

    color: #ffffff;

    font-size: 12px;

    letter-spacing: 4px;
}


/* =========================
   SYSTEM STATUS
   ========================= */

.status-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 7px 0;

    font-size: 13px;
}

.online {
    color: #00ff88;
}

.ready {
    color: #00eaff;
}

.thinking {
    color: #ffd43b;
}


/* =========================
   RESPONSE
   ========================= */

#reply {
    min-height: 130px;

    padding: 14px;

    border: 1px solid #00eaff;

    background:
        rgba(0, 8, 12, 0.75);

    color: #ffffff;

    line-height: 1.65;

    white-space: pre-wrap;

    font-size: 15px;

    overflow-wrap: break-word;
}


/* =========================
   INPUT
   ========================= */

textarea {
    width: 100%;

    min-height: 90px;

    resize: vertical;

    padding: 13px;

    background: #001015;

    border: 1px solid #00eaff;

    color: #00eaff;

    font-family: monospace;

    font-size: 15px;

    outline: none;

    border-radius: 0;
}

textarea::placeholder {
    color: #4bb7c0;
}

textarea:focus {
    box-shadow:
        0 0 15px rgba(0,234,255,0.35);
}


/* =========================
   BUTTONS
   ========================= */

.button-row {
    display: flex;

    gap: 10px;

    margin-top: 10px;
}

button {
    flex: 1;

    min-height: 55px;

    padding: 14px;

    border: 1px solid #00eaff;

    background: #00eaff;

    color: #001014;

    font-family: monospace;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;

    box-shadow:
        0 0 12px rgba(0,234,255,0.4);

    transition:
        transform 0.15s,
        box-shadow 0.15s;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.55;

    cursor: not-allowed;
}


/* =========================
   MIC BUTTON
   ========================= */

#micButton {
    flex: 0 0 78px;

    font-size: 21px;
}


/* =========================
   EPISODE 5
   MEMORY + VISION BUTTONS
   ========================= */

#clear-btn,
#cam-btn {
    flex: 0 0 58px;

    min-height: 55px;

    padding: 10px;

    font-size: 21px;
}


/* =========================
   HIDDEN CAMERA INPUT
   ========================= */

#img-input {
    display: none;
}


/* =========================
   LISTENING
   ========================= */

.listening {
    background: #ff3150 !important;

    border-color: #ff3150 !important;

    color: #ffffff !important;

    box-shadow:
        0 0 20px rgba(255,49,80,0.8) !important;
}


/* =========================
   FOOTER
   ========================= */

.footer {
    margin-top: 18px;

    padding-bottom: 10px;

    text-align: center;

    font-size: 10px;

    letter-spacing: 3px;

    color: #55cbd5;
}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <div class="logo">
        JARVIS
    </div>

    <div class="subtitle">
        MOBILE EDITION
    </div>

</div>


<!-- =========================
     CORE
     ========================= -->

<div class="core-area">

    <div class="core"></div>

</div>

<div class="core-status">
    CORE ACTIVE
</div>


<!-- =========================
     SYSTEM STATUS
     ========================= -->

<div class="panel">

    <div class="panel-title">
        SYSTEM STATUS
    </div>


    <div class="status-row">

        <span>
            AI CORE
        </span>

        <span
            id="brainStatus"
            class="online"
        >
            ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>
            NETWORK
        </span>

        <span class="online">
            ONLINE
        </span>

    </div>


    <div class="status-row">

        <span>
            VOICE
        </span>

        <span
            id="voiceStatus"
            class="ready"
        >
            READY
        </span>

    </div>


    <div class="status-row">

        <span>
            MEMORY
        </span>

        <span class="ready">
            READY
        </span>

    </div>

</div>


<!-- =========================
     RESPONSE
     ========================= -->

<div class="panel">

    <div class="panel-title">
        JARVIS RESPONSE
    </div>


    <div id="reply">
        Systems online.
        Awaiting your command, Vishnu.
    </div>

</div>


<!-- =========================
     INPUT
     ========================= -->

<div class="panel">

    <div class="panel-title">
        ASK JARVIS
    </div>


    <textarea
        id="prompt"
        rows="4"
        placeholder="Type your message here..."
    ></textarea>


    <div class="button-row">


        <!-- SEND -->

        <button
            id="sendButton"
            onclick="askJarvis()"
        >
            SEND
        </button>


        <!-- =========================
             EPISODE 5
             MEMORY CLEAR
             ========================= -->

        <button
            id="clear-btn"
            title="Clear Memory"
        >
            🧠
        </button>


        <!-- =========================
             EPISODE 5
             CAMERA / VISION
             ========================= -->

        <button
            id="cam-btn"
            title="Camera / Vision"
        >
            📷
        </button>


        <!-- =========================
             EPISODE 5
             IMAGE INPUT
             ========================= -->

        <input
            type="file"
            id="img-input"
            accept="image/*"
            capture="environment"
            style="display:none;"
        >


        <!-- MICROPHONE -->

        <button
            id="micButton"
            onclick="toggleListening()"
        >
            🎙️
        </button>


    </div>

</div>


<!-- =========================
     FOOTER
     ========================= -->

<div class="footer">
    JARVIS ONLINE • SECURE AI CORE
</div>


</div>


<script>

/* =====================================================
   CLOUDFLARE WORKER
   ===================================================== */

const WORKER_URL =
"https://jarvis-api.vishnudutha8810.workers.dev";


/* =====================================================
   ELEMENTS
   ===================================================== */

const promptBox =
document.getElementById("prompt");

const replyBox =
document.getElementById("reply");

const brainStatus =
document.getElementById("brainStatus");

const voiceStatus =
document.getElementById("voiceStatus");

const micButton =
document.getElementById("micButton");

const sendButton =
document.getElementById("sendButton");


/* =====================================================
   PROCESSING
   ===================================================== */

let isProcessing = false;


/* =====================================================
   VOICE STATE
   ===================================================== */

let availableVoices = [];

let selectedJarvisVoice = null;


/* =====================================================
   LOAD BROWSER VOICES
   ===================================================== */

function loadVoices() {

    if (!("speechSynthesis" in window)) {
        return;
    }

    availableVoices =
        window.speechSynthesis.getVoices();

    selectedJarvisVoice =
        findBestJarvisVoice();
}


/* =====================================================
   FIND BEST MALE ENGLISH VOICE
   ===================================================== */

function findBestJarvisVoice() {

    if (!availableVoices.length) {
        return null;
    }


    const preferredNames = [

        "Google UK English Male",

        "Google US English",

        "Microsoft George",

        "Microsoft Ryan Online",

        "Microsoft Guy Online",

        "Microsoft Daniel",

        "Daniel",

        "Alex",

        "Arthur",

        "James"

    ];


    /* ---------------------------------------------
       First: preferred voices
       --------------------------------------------- */

    for (
        const preferredName
        of preferredNames
    ) {

        const voice =
            availableVoices.find(
                voice => {

                    const name =
                        voice.name
                            .toLowerCase();

                    return name.includes(
                        preferredName.toLowerCase()
                    );

                }
            );


        if (voice) {
            return voice;
        }

    }


    /* ---------------------------------------------
       Second: any English voice
       --------------------------------------------- */

    const englishVoice =
        availableVoices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("en")
        );


    return englishVoice || null;
}


/* =====================================================
   INITIALIZE VOICES
   ===================================================== */

loadVoices();


if ("speechSynthesis" in window) {

    speechSynthesis.onvoiceschanged =
        function () {

            loadVoices();

        };

}


/* =====================================================
   CLEAN TEXT FOR SPEECH
   ===================================================== */

function cleanForSpeech(text) {

    let cleanText = text;


    cleanText =
        cleanText.replace(
            /\*\*(.*?)\*\*/g,
            "$1"
        );


    cleanText =
        cleanText.replace(
            /\*(.*?)\*/g,
            "$1"
        );


    cleanText =
        cleanText.replace(
            /`([^`]*)`/g,
            "$1"
        );


    cleanText =
        cleanText.replace(
            /---+/g,
            ". "
        );


    cleanText =
        cleanText.replace(
            /#+\s?/g,
            ""
        );


    return cleanText.trim();
}


/* =====================================================
   SPEAK JARVIS
   ===================================================== */

function speakJarvis(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        voiceStatus.textContent =
            "NOT SUPPORTED";

        return;

    }


    if (!text) {
        return;
    }


    speechSynthesis.cancel();


    const cleanText =
        cleanForSpeech(text);


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    utterance.rate =
        0.94;

    utterance.pitch =
        0.90;

    utterance.volume =
        1.0;


    if (!selectedJarvisVoice) {

        selectedJarvisVoice =
            findBestJarvisVoice();

    }


    if (selectedJarvisVoice) {

        utterance.voice =
            selectedJarvisVoice;

        utterance.lang =
            selectedJarvisVoice.lang;

    } else {

        utterance.lang =
            "en-GB";

    }


    utterance.onstart =
        function () {

            voiceStatus.textContent =
                "SPEAKING";

        };


    utterance.onend =
        function () {

            voiceStatus.textContent =
                "READY";

        };


    utterance.onerror =
        function () {

            voiceStatus.textContent =
                "READY";

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   ASK JARVIS
   ===================================================== */

async function askJarvis() {

    if (isProcessing) {
        return;
    }


    const userPrompt =
        promptBox.value.trim();


    if (!userPrompt) {

        replyBox.textContent =
            "Please enter a message, Vishnu.";

        return;

    }


    isProcessing =
        true;


    sendButton.disabled =
        true;


    sendButton.textContent =
        "THINKING...";


    brainStatus.textContent =
        "THINKING";


    brainStatus.className =
        "thinking";


    replyBox.textContent =
        "Jarvis is thinking...";


    try {


        /* =========================================
           SEND TO CLOUDFLARE WORKER
           ========================================= */

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        prompt:
                            userPrompt

                    })

                }
            );


        /* =========================================
           READ RESPONSE
           ========================================= */

        const data =
            await response.json();


        /* =========================================
           SERVER ERROR
           ========================================= */

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Jarvis request failed."
            );

        }


        /* =========================================
           GET REPLY
           ========================================= */

        const jarvisReply =
            data.reply ||
            "Jarvis received no response.";


        /* =========================================
           DISPLAY REPLY
           ========================================= */

        replyBox.textContent =
            jarvisReply;


        brainStatus.textContent =
            "ONLINE";


        brainStatus.className =
            "online";


        /* =========================================
           VOICE
           ========================================= */

        speakJarvis(
            jarvisReply
        );


    }
    catch (error) {


        brainStatus.textContent =
            "ERROR";


        brainStatus.className =
            "online";


        replyBox.textContent =
            "Connection error:\n\n"
            +
            error.message;

    }
    finally {


        isProcessing =
            false;


        sendButton.disabled =
            false;


        sendButton.textContent =
            "SEND";

    }

}


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let isListening =
    false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.lang =
        "en-IN";


    /* ===============================================
       MIC START
       =============================================== */

    recognition.onstart =
        function () {

            isListening =
                true;


            micButton.textContent =
                "⏹️";


            micButton.classList.add(
                "listening"
            );


            voiceStatus.textContent =
                "LISTENING";

        };


    /* ===============================================
       SPEECH RESULT
       =============================================== */

    recognition.onresult =
        function (event) {

            const transcript =
                event
                    .results[0][0]
                    .transcript;


            promptBox.value =
                transcript;


            /*
               Automatically send
               after speech recognition.
            */

            askJarvis();

        };


    /* ===============================================
       MIC ERROR
       =============================================== */

    recognition.onerror =
        function (event) {

            console.log(
                "Speech recognition error:",
                event.error
            );


            stopListening();

        };


    /* ===============================================
       MIC END
       =============================================== */

    recognition.onend =
        function () {

            stopListening();

        };

}


/* =====================================================
   TOGGLE MICROPHONE
   ===================================================== */

function toggleListening() {

    if (!recognition) {

        alert(
            "Speech recognition is not supported in this browser."
        );

        return;

    }


    if (isListening) {

        recognition.stop();

        return;

    }


    try {

        recognition.start();

    }
    catch (error) {

        console.log(error);

    }

}


/* =====================================================
   STOP LISTENING
   ===================================================== */

function stopListening() {

    isListening =
        false;


    micButton.textContent =
        "🎙️";


    micButton.classList.remove(
        "listening"
    );


    if (
        voiceStatus.textContent
