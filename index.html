<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jarvis Mobile Edition</title>

<style>

/* =========================
   RESET
   ========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 15%,
            #06323a 0%,
            #021217 35%,
            #000 75%
        );

    color: #00eaff;

    font-family: monospace;

    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 620px;

    margin: auto;

    padding: 16px;
}


/* =========================
   HEADER
   ========================= */

.header {
    text-align: center;

    padding: 8px 0 12px;
}

.logo {
    font-size: 34px;

    font-weight: bold;

    letter-spacing: 7px;

    color: #00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 40px rgba(0,234,255,0.45);
}

.subtitle {
    margin-top: 6px;

    font-size: 11px;

    letter-spacing: 4px;

    color: #7df8ff;
}


/* =========================
   CORE
   ========================= */

.core-area {
    display: flex;

    justify-content: center;
    align-items: center;

    margin: 5px 0 8px;
}

.core {
    width: 145px;
    height: 145px;

    border: 2px solid #00eaff;

    border-radius: 50%;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        0 0 15px #00eaff,
        0 0 35px rgba(0,234,255,0.35),
        inset 0 0 25px rgba(0,234,255,0.25);

    animation: corePulse 3s infinite;
}

.core::before {
    content: "";

    position: absolute;

    width: 88px;
    height: 88px;

    border: 2px solid #00eaff;

    border-radius: 50%;

    box-shadow:
        0 0 15px rgba(0,234,255,0.5);
}

.core::after {
    content: "";

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #00eaff;

    box-shadow:
        0 0 12px #00eaff,
        0 0 30px #00eaff,
        0 0 50px rgba(0,234,255,0.7);
}

@keyframes corePulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.045);
    }
}

.core-status {
    text-align: center;

    margin-bottom: 18px;

    color: #00ffcc;

    font-size: 12px;

    letter-spacing: 4px;
}


/* =========================
   PANELS
   ========================= */

.panel {
    border: 1px solid #00eaff;

    padding: 14px;

    margin-bottom: 14px;

    background:
        rgba(0, 18, 24, 0.55);

    box-shadow:
        0 0 12px rgba(0,234,255,0.12);
}

.panel-title {
    margin-bottom: 14px;

    color: #ffffff;

    font-size: 12px;

    letter-spacing: 4px;
}


/* =========================
   SYSTEM STATUS
   ========================= */

.status-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 7px 0;

    font-size: 13px;
}

.online {
    color: #00ff88;
}

.ready {
    color: #00eaff;
}

.thinking {
    color: #ffd43b;
}


/* =========================
   RESPONSE
   ========================= */

#reply {
    min-height: 130px;

    padding: 14px;

    border: 1px solid #00eaff;

    background:
        rgba(0, 8, 12, 0.75);

    color: #ffffff;

    line-height: 1.65;

    white-space: pre-wrap;

    font-size: 15px;

    overflow-wrap: break-word;
}


/* =========================
   INPUT
   ========================= */

textarea {
    width: 100%;

    min-height: 90px;

    resize: vertical;

    padding: 13px;

    background: #001015;

    border: 1px solid #00eaff;

    color: #00eaff;

    font-family: monospace;

    font-size: 15px;

    outline: none;

    border-radius: 0;
}

textarea::placeholder {
    color: #4bb7c0;
}

textarea:focus {
    box-shadow:
        0 0 15px rgba(0,234,255,0.35);
}


/* =========================
   BUTTONS
   ========================= */

.button-row {
    display: flex;

    gap: 8px;

    margin-top: 10px;
}

button {
    flex: 1;

    min-height: 55px;

    padding: 14px;

    border: 1px solid #00eaff;

    background: #00eaff;

    color: #001014;

    font-family: monospace;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;

    box-shadow:
        0 0 12px rgba(0,234,255,0.4);

    transition:
        transform 0.15s,
        box-shadow 0.15s;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.55;

    cursor: not-allowed;
}


/* =========================
   SPECIAL BUTTONS
   ========================= */

#micButton {
    flex: 0 0 65px;

    font-size: 21px;
}

#clear-btn,
#cam-btn {
    flex: 0 0 58px;

    font-size: 21px;

    padding: 10px;
}

#img-input {
    display: none;
}


/* =========================
   LISTENING
   ========================= */

.listening {
    background: #ff3150 !important;

    border-color: #ff3150 !important;

    color: #ffffff !important;

    box-shadow:
        0 0 20px rgba(255,49,80,0.8) !important;
}


/* =========================
   FOOTER
   ========================= */

.footer {
    margin-top: 18px;

    padding-bottom: 10px;

    text-align: center;

    font-size: 10px;

    letter-spacing: 3px;

    color: #55cbd5;
}

</style>

</head>


<body>

<div class="container">


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <div class="logo">
        JARVIS
    </div>

    <div class="subtitle">
        MOBILE EDITION
    </div>

</div>


<!-- =========================
     CORE
     ========================= -->

<div class="core-area">

    <div class="core"></div>

</div>

<div class="core-status">
    CORE ACTIVE
</div>


<!-- =========================
     SYSTEM STATUS
     ========================= -->

<div class="panel">

    <div class="panel-title">
        SYSTEM STATUS
    </div>

    <div class="status-row">

        <span>
            AI CORE
        </span>

        <span
            id="brainStatus"
            class="online"
        >
            ONLINE
        </span>

    </div>

    <div class="status-row">

        <span>
            NETWORK
        </span>

        <span class="online">
            ONLINE
        </span>

    </div>

    <div class="status-row">

        <span>
            VOICE
        </span>

        <span
            id="voiceStatus"
            class="ready"
        >
            READY
        </span>

    </div>

    <div class="status-row">

        <span>
            MEMORY
        </span>

        <span
            id="memoryStatus"
            class="ready"
        >
            READY
        </span>

    </div>

</div>


<!-- =========================
     RESPONSE
     ========================= -->

<div class="panel">

    <div class="panel-title">
        JARVIS RESPONSE
    </div>

    <div id="reply">
        Systems online.
        Awaiting your command, Boss.
    </div>

</div>


<!-- =========================
     INPUT
     ========================= -->

<div class="panel">

    <div class="panel-title">
        ASK JARVIS
    </div>

    <textarea
        id="prompt"
        rows="4"
        placeholder="Type your message here..."
    ></textarea>


    <div class="button-row">


        <!-- SEND -->

        <button
            id="sendButton"
        >
            SEND
        </button>


        <!-- MEMORY -->

        <button
            id="clear-btn"
            title="Clear Memory"
        >
            🧠
        </button>


        <!-- CAMERA -->

        <button
            id="cam-btn"
            title="Camera / Vision"
        >
            📷
        </button>


        <!-- IMAGE INPUT -->

        <input
            type="file"
            id="img-input"
            accept="image/*"
            capture="environment"
        >


        <!-- MICROPHONE -->

        <button
            id="micButton"
        >
            🎙️
        </button>


    </div>

</div>


<!-- =========================
     FOOTER
     ========================= -->

<div class="footer">
    JARVIS ONLINE • SECURE AI CORE
</div>


</div>


<script>

/* =====================================================
   JARVIS EPISODE 5
   MEMORY + EYES
   ===================================================== */


/* =====================================================
   CLOUDFLARE WORKER
   ===================================================== */

const WORKER_URL =
    "https://jarvis-api.vishnudutha8810.workers.dev";


/* =====================================================
   ELEMENTS
   ===================================================== */

const promptBox =
    document.getElementById("prompt");

const replyBox =
    document.getElementById("reply");

const brainStatus =
    document.getElementById("brainStatus");

const voiceStatus =
    document.getElementById("voiceStatus");

const memoryStatus =
    document.getElementById("memoryStatus");

const micButton =
    document.getElementById("micButton");

const sendButton =
    document.getElementById("sendButton");

const clearButton =
    document.getElementById("clear-btn");

const cameraButton =
    document.getElementById("cam-btn");

const imageInput =
    document.getElementById("img-input");


/* =====================================================
   MEMORY
   ===================================================== */

const MEMORY_KEY =
    "jarvis_memory";

let MEMORY = [];


/* =====================================================
   LOAD MEMORY
   ===================================================== */

function loadMemory() {

    try {

        const saved =
            localStorage.getItem(
                MEMORY_KEY
            );

        if (saved) {

            MEMORY =
                JSON.parse(saved);

        } else {

            MEMORY = [];

        }

    }
    catch (error) {

        console.error(
            "Memory load error:",
            error
        );

        MEMORY = [];

    }

}


/* =====================================================
   SAVE MEMORY
   ===================================================== */

function saveMemory() {

    try {

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(MEMORY)
        );

        memoryStatus.textContent =
            "READY";

    }
    catch (error) {

        console.error(
            "Memory save error:",
            error
        );

        memoryStatus.textContent =
            "ERROR";

    }

}


/* =====================================================
   ADD MEMORY
   ===================================================== */

function addMemory(
    role,
    text
) {

    MEMORY.push({

        role: role,

        text: text,

        time: Date.now()

    });


    /*
       Keep latest 30 messages.
    */

    if (MEMORY.length > 30) {

        MEMORY =
            MEMORY.slice(-30);

    }


    saveMemory();

}


/* =====================================================
   MEMORY CONTEXT
   ===================================================== */

function getMemoryContext() {

    if (!MEMORY.length) {

        return "";

    }


    return MEMORY
        .map(
            item =>
                item.role.toUpperCase()
                + ": "
                + item.text
        )
        .join("\n");

}


/* =====================================================
   CLEAR MEMORY
   ===================================================== */

clearButton.onclick =
    function () {

        const confirmed =
            confirm(
                "Clear Jarvis memory?"
            );


        if (!confirmed) {

            return;

        }


        MEMORY = [];


        localStorage.removeItem(
            MEMORY_KEY
        );


        memoryStatus.textContent =
            "CLEARED";


        replyBox.textContent =
            "Memory cleared successfully.";

    };


/* =====================================================
   INITIAL MEMORY LOAD
   ===================================================== */

loadMemory();


/* =====================================================
   PROCESSING
   ===================================================== */

let isProcessing =
    false;


/* =====================================================
   VOICE
   ===================================================== */

let availableVoices = [];

let selectedJarvisVoice = null;


/* =====================================================
   LOAD VOICES
   ===================================================== */

function loadVoices() {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    availableVoices =
        speechSynthesis.getVoices();


    selectedJarvisVoice =
        findBestJarvisVoice();

}


/* =====================================================
   FIND JARVIS VOICE
   ===================================================== */

function findBestJarvisVoice() {

    if (!availableVoices.length) {

        return null;

    }


    const preferredNames = [

        "Google UK English Male",
        "Google US English",
        "Microsoft George",
        "Microsoft Ryan Online",
        "Microsoft Guy Online",
        "Microsoft Daniel",
        "Daniel",
        "Alex",
        "Arthur",
        "James"

    ];


    for (
        const preferredName
        of preferredNames
    ) {

        const voice =
            availableVoices.find(
                voice =>
                    voice.name
                        .toLowerCase()
                        .includes(
                            preferredName
                                .toLowerCase()
                        )
            );


        if (voice) {

            return voice;

        }

    }


    return (
        availableVoices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith("en")
        ) || null
    );

}


/* =====================================================
   INITIALIZE VOICES
   ===================================================== */

loadVoices();


if (
    "speechSynthesis" in window
) {

    speechSynthesis.onvoiceschanged =
        function () {

            loadVoices();

        };

}


/* =====================================================
   CLEAN SPEECH
   ===================================================== */

function cleanForSpeech(text) {

    return text

        .replace(
            /\*\*(.*?)\*\*/g,
            "$1"
        )

        .replace(
            /\*(.*?)\*/g,
            "$1"
        )

        .replace(
            /`([^`]*)`/g,
            "$1"
        )

        .replace(
            /---+/g,
            ". "
        )

        .replace(
            /#+\s?/g,
            ""
        )

        .trim();

}


/* =====================================================
   SPEAK
   ===================================================== */

function speakJarvis(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        voiceStatus.textContent =
            "NOT SUPPORTED";

        return;

    }


    if (!text) {

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanForSpeech(text)
        );


    utterance.rate =
        0.94;

    utterance.pitch =
        0.90;

    utterance.volume =
        1.0;


    if (!selectedJarvisVoice) {

        selectedJarvisVoice =
            findBestJarvisVoice();

    }


    if (selectedJarvisVoice) {

        utterance.voice =
            selectedJarvisVoice;

        utterance.lang =
            selectedJarvisVoice.lang;

    }
    else {

        utterance.lang =
            "en-GB";

    }


    utterance.onstart =
        function () {

            voiceStatus.textContent =
                "SPEAKING";

        };


    utterance.onend =
        function () {

            voiceStatus.textContent =
                "READY";

        };


    utterance.onerror =
        function () {

            voiceStatus.textContent =
                "READY";

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   ASK JARVIS
   ===================================================== */

async function askJarvis() {

    if (isProcessing) {

        return;

    }


    const userPrompt =
        promptBox.value.trim();


    if (!userPrompt) {

        replyBox.textContent =
            "Please enter a message.";

        return;

    }


    isProcessing =
        true;


    sendButton.disabled =
        true;


    sendButton.textContent =
        "THINKING...";


    brainStatus.textContent =
        "THINKING";


    brainStatus.className =
        "thinking";


    replyBox.textContent =
        "Jarvis is thinking...";


    /*
       Save user message.
    */

    addMemory(
        "user",
        userPrompt
    );


    try {


        const memoryContext =
            getMemoryContext();


        const response =
            await fetch(
                WORKER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            prompt:
                                userPrompt,

                            memory:
                                memoryContext

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Jarvis request failed."
            );

        }


        const jarvisReply =
            data.reply ||
            "Jarvis received no response.";


        /*
           Save response.
        */

        addMemory(
            "assistant",
            jarvisReply
        );


        replyBox.textContent =
            jarvisReply;


        brainStatus.textContent =
            "ONLINE";


        brainStatus.className =
            "online";


        speakJarvis(
            jarvisReply
        );


        promptBox.value =
            "";

    }
    catch (error) {

        /*
           If request failed,
           remove last user message
           so failed requests don't
           become permanent memory.
        */

        if (
            MEMORY.length &&
            MEMORY[MEMORY.length - 1]
                .role === "user"
        ) {

            MEMORY.pop();

            saveMemory();

        }


        brainStatus.textContent =
            "ERROR";


        brainStatus.className =
            "online";


        replyBox.textContent =
            "Connection error:\n\n"
            +
            error.message;

    }
    finally {

        isProcessing =
            false;


        sendButton.disabled =
            false;


        sendButton.textContent =
            "SEND";

    }

}


/* =====================================================
   SEND BUTTON
   ===================================================== */

sendButton.onclick =
    function () {

        askJarvis();

    };


/* =====================================================
   CTRL + ENTER
   ===================================================== */

promptBox.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            event.ctrlKey
        ) {

            event.preventDefault();

            askJarvis();

        }

    }
);


/* =====================================================
   SPEECH RECOGNITION
   ===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function () {
    listening = true;

    voiceStatus.textContent = "LISTENING";
    micButton.textContent = "⏹️";
  };

  recognition.onresult = function (event) {
    const transcript =
      event.results[0][0].transcript;

    promptBox.value = transcript;

    setTimeout(function () {
      askJarvis();
    }, 200);
  };

  recognition.onerror = function (event) {
    console.log("Speech recognition error:", event.error);

    listening = false;

    voiceStatus.textContent = "VOICE READY";
    micButton.textContent = "🎙️";
  };

  recognition.onend = function () {
    listening = false;

    voiceStatus.textContent = "VOICE READY";
    micButton.textContent = "🎙️";
  };
}


// ================================
// VOICE BUTTON
// ================================

function toggleListening() {

  if (!recognition) {
    alert(
      "Voice recognition is not supported in this browser."
    );
    return;
  }

  if (listening) {
    recognition.stop();
  } else {
    try {
      recognition.start();
    } catch (error) {
      console.log("Recognition start error:", error);
    }
  }
}


// ================================
// MEMORY CLEAR BUTTON
// ================================

const clearButton =
  document.getElementById("clear-btn");

if (clearButton) {

  clearButton.onclick = function () {

    const confirmClear = confirm(
      "Clear Jarvis memory?"
    );

    if (!confirmClear) return;

    MEMORY = [];

    saveMemory();

    replyBox.textContent =
      "Memory cleared. Fresh session ready, Boss.";

    brainStatus.textContent =
      "MEMORY CLEARED";

    brainStatus.className =
      "online";

    speakJarvis(
      "Memory cleared. Fresh session ready, Boss."
    );
  };
}


// ================================
// CAMERA / VISION BUTTON
// ================================

const cameraButton =
  document.getElementById("cam-btn");

const imageInput =
  document.getElementById("img-input");

if (cameraButton && imageInput) {

  cameraButton.onclick = function () {
    imageInput.click();
  };

  imageInput.onchange = function (event) {

    const file =
      event.target.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = function () {

      window.jarvisVisionImage =
        reader.result;

      replyBox.textContent =
        "Image ready for Jarvis Vision. Ask me about the image, Boss.";

      brainStatus.textContent =
        "VISION READY";

      brainStatus.className =
        "online";
    };

    reader.onerror = function () {

      replyBox.textContent =
        "Unable to read the image.";

      brainStatus.textContent =
        "VISION ERROR";

      brainStatus.className =
        "offline";
    };

    reader.readAsDataURL(file);
  };
}


// ================================
// CTRL + ENTER
// ================================

promptBox.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Enter" &&
      event.ctrlKey
    ) {

      event.preventDefault();

      askJarvis();
    }
  }
);


// ================================
// INITIAL STATUS
// ================================

brainStatus.textContent =
  "AI CORE ONLINE";

brainStatus.className =
  "online";

voiceStatus.textContent =
  "VOICE READY";


// ================================
// STARTUP MESSAGE
// ================================

window.addEventListener(
  "load",
  function () {

    if (
      replyBox &&
      !replyBox.textContent.trim()
    ) {

      replyBox.textContent =
        "Systems online. Awaiting your command, Boss.";
    }
  }
);

</script>

</body>
</html>
